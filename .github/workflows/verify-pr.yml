name: Verify data
on:
  pull_request:
    paths: ['data/opportunities.json']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Probe every link, enforce receipts + no-aggregator rule
        run: node scripts/verify.mjs
